name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest tests/ -q
      - name: graph validate
        run: python docs/knowledge/ad-agent-qa/graph/tools/validate.py

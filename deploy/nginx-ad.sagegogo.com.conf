# ad.sagegogo.com — KB Workbench vhost
# 安装: /etc/nginx/conf.d/ad.sagegogo.com.conf
# 流程: 先只启 80 段 → certbot 签证书 → 再启 443 段（本文件两段可同时存在，
#       但 443 段引用的证书须已签发，否则 nginx -t 失败）

# 上传接口防刷：仅 /api/ingest 前缀限速（GET 浏览不受影响——burst 够 UI 使用）
limit_req_zone $binary_remote_addr zone=kb_ingest:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ad.sagegogo.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ad.sagegogo.com;
    ssl_certificate /etc/letsencrypt/live/ad.sagegogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad.sagegogo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 55m;   # 对齐应用层 50MB 上传上限 + 余量

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;

    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8010;
    }

    # 摄入写接口：大文件上传需要更长超时 + 轻量限速防滥用
    location ~ ^/api/ingest {
        limit_req zone=kb_ingest burst=60 nodelay;
        client_max_body_size 55m;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}

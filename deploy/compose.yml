# KB Workbench — 生产编排（服务器 /opt/kb-workbench/compose.yml）
# 镜像由 deploy.sh 在本地构建 linux/amd64 后 docker save|load 传输，服务器不构建。
name: kb-workbench

services:
  app:
    image: kb-workbench:${KB_TAG:-latest}
    container_name: kb-workbench
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - /data/kb-workbench/staging:/data/staging
    environment:
      KB_ROOT: /app/docs/knowledge/ad-agent-qa
      STAGING_DIR: /data/staging
    # 容器级健康检查与 Dockerfile HEALTHCHECK 一致，compose 侧兜底
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
